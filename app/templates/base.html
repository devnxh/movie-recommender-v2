<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineWatch{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/Cinewatch.png') }}">
    <!-- Fonts (Stitch "Nocturne Cinema" design system: Outfit + Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/outfit@5.3.0/wght.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/plus-jakarta-sans@5.3.0/wght.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    <!-- Animate.css (used by main.js for small attention effects) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body id="top">
    <a class="skip-link" href="#catalog">Skip to movies</a>
    <nav class="site-nav sticky-top" aria-label="Main navigation">
        <div class="container-xl nav-inner">
            <a class="brand-link" href="/" aria-label="CineWatch home">
                <span class="brand-mark" aria-hidden="true"><i class="fas fa-play"></i></span>
                <span class="site-name">Cine<span>Watch</span></span>
            </a>
            <div class="nav-destinations">
                <button type="button" class="nav-action" id="browse-movies">Browse</button>
                <button type="button" class="nav-action" id="quick-search" aria-label="Search movies" aria-keyshortcuts="/">
                    <i class="fas fa-magnifying-glass" aria-hidden="true"></i><span class="search-nav-text">Search</span><kbd aria-hidden="true">/</kbd>
                </button>
                <button type="button" class="nav-action watchlist-action" id="show-watchlist" aria-label="Show watchlist">
                    <i class="far fa-bookmark" aria-hidden="true"></i><span>Watchlist</span><span class="list-count" id="watchlist-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-xl">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container-xl d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
            <span class="site-name small-name">Cine<span>Watch</span></span>
            <a class="footer-top" href="#top">Back to top <span aria-hidden="true">↑</span></a>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/motion.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
